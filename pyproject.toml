[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qsm"
version = "0.0.1"
description = "Custom-core quantum circuit toolkit for Ed25519/Wei25519 scalar multiplication (Shor)."
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
qsm = "qsm.cli:main"

[tool.setuptools.packages.find]
include = ["qsm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q"
markers = [
    # Builds a full-width circuit (tens of seconds). Deselect with `-m 'not slow'`.
    "slow: builds a real-width circuit rather than a toy one",
]
